# Minimal Falco config for kalived-falco.sh. Stock rules_files must stay empty
# except falco-host.yaml (absolute path injected at runtime).
# No gRPC, no webserver, no http_output, no syslog, no always-on file.

rules_files: []

json_output: true
json_include_output_property: false
json_include_tags_property: false
priority: warning
watch_config_files: false
time_format_iso_8601: true

stdout_output:
  enabled: true
syslog_output:
  enabled: false
file_output:
  enabled: false
http_output:
  enabled: false

webserver:
  enabled: false
grpc:
  enabled: false

load_plugins: []
libs_logger:
  enabled: false
