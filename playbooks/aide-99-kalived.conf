# kalived focused FIM — identity + persistence, not whole /usr (Kali rolling noise).
@@define DBDIR /var/lib/aide
database_in=file:@@{DBDIR}/kalived.db.gz
database_out=file:@@{DBDIR}/kalived.db.new.gz
gzip_dbout=yes
report_url=stdout

# AIDE 0.19: m = mtime (not the word "mtime")
Kalived = p+i+n+u+g+s+b+m+sha256

/etc/passwd Kalived
/etc/shadow Kalived
/etc/group Kalived
/etc/gshadow Kalived
/etc/sudoers Kalived
/etc/sudoers.d Kalived
/etc/ld.so.preload Kalived
/etc/ssh Kalived
/etc/systemd Kalived
/etc/cron.d Kalived
/etc/crontab Kalived
/etc/cron.hourly Kalived
/etc/cron.daily Kalived
/etc/cron.weekly Kalived
/etc/cron.monthly Kalived
/etc/udev/rules.d Kalived
/usr/bin/sudo Kalived
/usr/bin/su Kalived
/usr/bin/passwd Kalived
/usr/bin/pkexec Kalived
# Scanner runtime (not baselines/prev_snapshot — those change every freeze).
/usr/local/lib/kalived/scripts Kalived
/usr/local/lib/kalived/prompts Kalived
/usr/local/lib/kalived/playbooks/rkhunter.conf.local Kalived
/usr/sbin/kalived-ctl Kalived
